# ============================================================
#  714 METHOD + MEDALLION TRADING BOT  —  configuration
#  method "714"      = The 714 Method (Mashaya Mthethwa / Forxee Group)
#  method "medallion" = Medallion-style quant system (mean-reversion
#                      core + trend filter + hedged pairs + risk brakes).
#                      See "Most_Profitable_Trading_Strategy_Ever_
#                      Explained_Simply.pdf" for the plain-English guide.
#  Can also be set via the METHOD env var (METHOD=medallion).
# ============================================================
method: "714"

# ---- Broker ----
broker:
  # alpaca only supports US equities + crypto. Set keys via env vars
  # ALPACA_API_KEY / ALPACA_SECRET_KEY, or a .env file.
  mode: paper            # paper | live
  data_feed: iex         # iex (free) | sip (paid)

# ---- Strategy core settings ----
strategy:
  # Symbols to watch. The 714 method is a forex/synthetic-index strategy;
  # on Alpaca we trade liquid US stocks + 24/7 crypto so the bot has data
  # during every session window (stocks only trade 09:30-16:00 NY).
  # Crypto symbols use the "BTC/USD" format. NOTE: Alpaca does not allow
  # shorting crypto, so crypto signals are BUY-only (W formations).
  symbols:
    - BTC/USD
    - ETH/USD
    - SOL/USD
    - AVAX/USD
    - LINK/USD
    - DOGE/USD
    - ADA/USD
    - MATIC/USD
    - AAPL
    - MSFT
    - SPY

  timeframe: 15Min       # candles used for structure (M15 per the book)

  # Session filter (the book uses 07h00 / 13h00 / 16h00 SAST + 09-11,
  # 14-16, 18-20 windows). Times are interpreted in the timezone below.
  session_timezone: "Africa/Johannesburg"
  use_session_filter: true
  session_windows:       # HH:MM-HH:MM (SAST) when the bot may trade
    - "09:00-11:00"
    - "14:00-16:00"
    - "18:00-20:00"

  # Swing-point detection: a candle is a swing high/low if it is the
  # extreme among `swing_lookback` candles on each side.
  swing_lookback: 2

  # ---- Entry criteria (mirrors the book's 8-step setups) ----
  # SELL: London open -> prior Higher Low -> market rises -> "M"
  #       (double top) -> break of structure -> new Lower Low -> OB sell
  # BUY : London open -> prior Lower High -> market drops -> "W"
  #       (double bottom) -> break of structure -> new Higher High -> OB buy
  require_break_of_structure: true
  w_formation_tolerance: 0.0005   # % price tolerance for double tops/bottoms

# ---- Medallion-style quant strategy (used when method: medallion) ----
medallion:
  symbols:
    - BTC/USD
    - ETH/USD
    - SOL/USD
    - AAPL
    - MSFT
    - SPY
  timeframe: 15Min

  # --- Mean-reversion core (SECRET 3: the rubber band) ---
  mr_lookback: 20        # SMA window for the "mean"
  entry_z: 2.0           # z-score trigger: price >= 2 std-devs stretched
  rsi_period: 2          # fast RSI trigger
  rsi_oversold: 15       # longs trigger at RSI <= this (if use_rsi_filter)
  rsi_overbought: 85     # shorts trigger at RSI >= this
  use_rsi_filter: true
  # "either" = z-score OR RSI fires (more trades, good for learning).
  # "both"   = needs z-score AND RSI together (stricter, for live money).
  trigger_mode: "either"

  # --- Trend filter (SECRET 4: buy dips in uptrends only) ---
  trend_len: 50          # regime average
  trend_slope_bars: 5    # uptrend = 50-bar SMA rising over last 5 bars
  use_trend_filter: false  # off by default (pure MR core); enable for live
  # Optional breakout sleeve (ride strong waves). Off by default —
  # master mean-reversion first, then enable and compare.
  use_trend_sleeve: false
  breakout_len: 20       # N-bar Donchian breakout

  # --- Pairs (SECRET 5: market-neutral hedged bets) ---
  # Stocks only — pairs need a short leg and Alpaca can't short crypto.
  pairs:
    - [AAPL, MSFT]
  pair_lookback: 30      # spread SMA window
  pair_entry_z: 1.5      # enter spread when stretched >= 1.5 std-devs (use 2.0 for live)
  pair_exit_z: 0.5       # exit both legs when spread normalizes
  pair_min_corr: 0.7     # only trade pairs this correlated ("twins")

  # --- Risk brakes (SECRET 7: leverage + automatic brakes) ---
  leverage: 1.0          # 1.0 = NO leverage. Keep it until proven 6-12 mo.
  max_open_trades: 6     # room for singles + pair legs
  max_hold_bars: 20      # time stop: exit if no snap-back in N bars (0=off)
  max_daily_loss_pct: 3.0  # daily kill-switch: halt all trading past -3%
  atr_period: 14
  atr_stop_mult: 2.0
  min_stop_pct: 0.003

# ---- Risk management (R-multiple based — fixes the inverted risk:reward) ----
risk:
  risk_mode: percent       # percent | fixed_pips | atr
  risk_percent: 1.0        # % of account equity risked per trade
  max_lot_percent: 5.0     # cap position size as % of equity (anti-overleverage)
  max_open_trades: 3
  min_stop_pct: 0.003      # absolute min stop distance as % of price

  # ---- Stop (option 2: ATR-based) ----
  # Stop distance = max(swing-pattern stop, ATR * atr_stop_mult). Keeps
  # stops from being too tight in volatile markets (which caused churn).
  atr_period: 14
  atr_stop_mult: 2.0       # minimum stop = ATR x this

  # ---- Target (option 1: risk:reward) ----
  # Target = stop distance x this ratio, so a win always pays >= 2x a loss.
  # (The old fixed "50 pip" target was inverted: $2 risk for $0.50 reward.)
  risk_reward_ratio: 2.0

  # ---- Trade management in R-multiples (1R = stop distance) ----
  breakeven_r: 0.5         # move SL to breakeven at +0.5R profit
  partial_r: 1.0           # take partial at +1.0R
  partial_fraction: 0.5    # close 50% of position at partial
  lock_r: 0.5              # after partial, lock remaining SL at +0.5R

  # Legacy pip value (kept for reference / helpers)
  pip_value: 0.01

# ---- Engine ----
engine:
  poll_seconds: 15          # how often the loop checks candles/sessions
  signal_cooldown_secs: 300 # same symbol+side signal re-fires only after 5 min
  reentry_cooldown_secs: 300 # wait 5 min before re-entering a symbol after an exit
  candle_warmup: 60         # minimum candles loaded before signals
  log_file: data/trades.csv

# ---- Dashboard ----
dashboard:
  host: 0.0.0.0
  port: 8000
