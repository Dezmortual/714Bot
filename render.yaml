# Render "Blueprint" — one-click deploy via render.com
# Note: Render's free tier sleeps after inactivity, so for an always-on
# trading bot use a paid instance (Starter) or a VPS instead.

services:
  - type: web
    name: 714-method-bot
    runtime: python
    plan: starter            # always-on (free tier sleeps — not ideal for a bot)
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --config gunicorn.conf.py --bind 0.0.0.0:$PORT"
    envVars:
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
